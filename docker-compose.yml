version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autocomm-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: autocomm
      POSTGRES_PASSWORD: autocomm_secret
      POSTGRES_DB: autocomm
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
